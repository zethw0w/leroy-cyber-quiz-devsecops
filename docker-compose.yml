# Execução local: docker compose up --build  →  http://localhost:8080
services:
  app:
    build:
      context: .
      args:
        GIT_SHA: local
    image: leroy-cyber-quiz:local
    ports:
      - "8080:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
